<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0}</style>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- royal blue field -->
  <rect width="1024" height="1024" fill="#1747A5"/>

  <!-- green base with the white swoosh separation (bows down in the middle) -->
  <path d="M0,648 Q512,798 1024,648 L1024,1024 L0,1024 Z" fill="#fff"/>
  <path d="M0,666 Q512,816 1024,666 L1024,1024 L0,1024 Z" fill="#3FA33C"/>

  <!-- roof line -->
  <path d="M160,330 L512,162 L830,318" fill="none" stroke="#fff" stroke-width="52" stroke-linecap="square"/>

  <!-- DB monogram, heavy italic -->
  <g font-family="'DejaVu Sans', Arial, sans-serif" font-weight="bold" font-style="italic">
    <text x="128" y="640" font-size="420" fill="#1747A5" stroke="#fff" stroke-width="18" paint-order="stroke">D</text>
    <text x="360" y="700" font-size="420" fill="#3FA33C" stroke="#fff" stroke-width="18" paint-order="stroke">B</text>
  </g>

  <!-- clipboard -->
  <g transform="translate(6,52)">
    <rect x="672" y="330" width="270" height="360" rx="34" fill="none" stroke="#fff" stroke-width="26"/>
    <rect x="742" y="300" width="130" height="64" rx="18" fill="#fff"/>
    <circle cx="807" cy="308" r="26" fill="#fff"/>
    <circle cx="807" cy="308" r="12" fill="#1747A5"/>
    <!-- row 1: check + line -->
    <path d="M712,428 L738,456 L788,398" fill="none" stroke="#3FA33C" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="812" y="424" width="96" height="22" rx="11" fill="#fff"/>
    <!-- row 2: check + line -->
    <path d="M712,522 L738,550 L788,492" fill="none" stroke="#3FA33C" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="812" y="518" width="96" height="22" rx="11" fill="#fff"/>
    <!-- row 3: open circle + line -->
    <circle cx="748" cy="622" r="30" fill="none" stroke="#3FA33C" stroke-width="18"/>
    <rect x="812" y="612" width="96" height="22" rx="11" fill="#fff"/>
  </g>

  <!-- wordmark on the green base -->
  <text x="512" y="905" text-anchor="middle" font-family="'DejaVu Sans', Arial, sans-serif" font-weight="bold" font-style="italic" font-size="148" letter-spacing="2" fill="#fff">CLOSE OUT</text>
  <path d="M232,960 Q512,1004 792,960" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
</svg>
